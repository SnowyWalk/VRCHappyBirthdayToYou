name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build production Docker image
        run: docker compose build
      - name: Start Docker app
        run: |
          docker compose up -d --wait --wait-timeout 120
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop containers
        if: always()
        run: docker compose down

  # Updates the EC2 Docker service after every verified push to main.
  # Required repository secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY.
  # Optional: EC2_PORT (default 22), EC2_APP_DIR, EC2_KNOWN_HOSTS.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hbd.snowywalk.me
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ubuntu/VRCHappyBirthdayToYou' }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HAS_KEY: ${{ secrets.EC2_SSH_KEY != '' }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::EC2 deploy secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Secrets set from Windows may carry CRLF line endings.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts
          fi
      - name: Deploy to EC2
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "cd '$EC2_APP_DIR' && git fetch --prune origin main && git merge --ff-only '$GITHUB_SHA' && bash scripts/deploy.sh '$GITHUB_SHA'"
      - name: Check public site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null https://hbd.snowywalk.me/; then exit 0; fi
            sleep 10
          done
          echo "::error::https://hbd.snowywalk.me/ did not respond after deploy."
          exit 1
